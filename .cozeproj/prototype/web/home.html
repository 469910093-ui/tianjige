<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://lf-code-agent.coze.cn/obj/x-ai-cn/fonts/google/google-all-fonts.css" rel="stylesheet"/>

  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/jquery/jquery-3.7.1.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/lucide/lucide-1.11.0.min.js"></script>
  <script src="https://lf-code-agent.coze.cn/obj/x-ai-cn/cdn/tailwindcss/tailwindcss-browser-4.2.4.min.js"></script>

  <style type="text/tailwindcss">
    @theme {
      /* === 品牌色 — 琥珀赭石，命理文化感 === */
      --color-primary:              #C96F3D;
      --color-primary-container:    #F5DDD0;
      --color-on-primary:           #ffffff;
      /* === 背景 / 表面 — 温暖纸感 === */
      --color-background:                 #FBF3E7;
      --color-surface-container-lowest:   #FFF9F1;
      --color-surface:                    #FFF9F1;
      --color-surface-container:          #F3E8D8;
      --color-surface-container-high:     #EDDCD0;
      --color-surface-container-highest:  #E5D0BF;
      /* === 文字 === */
      --color-on-surface:           #31251B;
      --color-on-surface-variant:   #8B7662;
      /* === 功能色 === */
      --color-success:  #7E9F7A;
      --color-error:    #C75050;
      --color-warning:  #D4A24E;
      /* === 边框 === */
      --color-outline:          #C4B09E;
      --color-outline-variant:  #D9CCBE;
      /* === 圆角 — 温润圆润 === */
      --radius-sm:   0.375rem;
      --radius-md:   0.5rem;
      --radius-lg:   0.75rem;
      --radius-xl:   1rem;
      --radius-2xl:  1.5rem;
      --radius-full: 9999px;
      /* === 阴影 — 轻柔纸感 === */
      --shadow-card:   0 2px 8px rgba(49,37,27,0.08);
      --shadow-float:  0 10px 25px rgba(49,37,27,0.12);
      --shadow-dialog: 0 25px 50px rgba(49,37,27,0.18);
      /* === 字体 — 宋体标题 + 系统正文 === */
      --font-sans: "Lora", "Noto Serif SC", system-ui, serif;
    }
  </style>

  <!-- 图片兜底 -->
  <script>
    document.addEventListener('error', function (e) {
      const img = e.target;
      if (img.tagName !== 'IMG' || img.dataset.fallback) return;
      img.dataset.fallback = '1';
      const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const cat = img.getAttribute('data-category') || '其他';
      const alt = img.getAttribute('alt') || '';
      const label = esc(alt.length > 8 ? alt.slice(0, 8) + '…' : alt);
      const icons = { '人物': '👤', '自然风景': '🏞', '动物': '🐾', '建筑城市': '🏙', '运动体育': '⚽', '交通工具': '🚗', '食物': '🍽', '服饰时尚': '👗', '商业科技': '💼', '游戏娱乐': '🎮', '艺术': '🎨', '其他': '🖼' };
      const icon = icons[cat] || '🖼';
      const w = img.width || 400, h = img.height || 300;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><rect width="100%" height="100%" fill="%23f3f4f6"/><text x="50%" y="45%" text-anchor="middle" font-size="${Math.min(w, h) * 0.18}" dominant-baseline="central">${icon}</text><text x="50%" y="68%" text-anchor="middle" font-size="${Math.min(w, h) * 0.07}" fill="%239ca3af" font-family="system-ui,sans-serif" dominant-baseline="central">${label}</text></svg>`;
      img.src = 'data:image/svg+xml,' + svg;
    }, true);
  </script>
</head>

<body class="bg-background text-on-surface font-sans">

  <!-- @nav:start -->
  <header class="bg-surface/80 backdrop-blur-md sticky top-0 z-40 border-b border-outline-variant/15">
    <div class="max-w-6xl mx-auto h-16 flex items-center justify-between px-6">
      <a href="home.html" class="flex items-center gap-2.5">
        <i data-lucide="sparkles" class="text-primary w-5 h-5"></i>
        <span class="font-bold text-lg text-on-surface">天机阁</span>
      </a>
      <nav class="flex items-center gap-1">
        <a href="home.html" class="px-3 py-1.5 text-sm font-medium text-primary bg-primary/10 rounded-md" aria-current="page">首页</a>
        <a href="bazi.html" class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors">八字命盘</a>
        <a href="astrology.html" class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors">星座星盘</a>
        <a href="tarot.html" class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors">塔罗占卜</a>
        <a href="dream.html" class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors">周公解梦</a>
        <a href="horoscope.html" class="px-3 py-1.5 text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container rounded-md transition-colors">每日运势</a>
      </nav>
    </div>
  </header>
  <!-- @nav:end -->

  <!-- @main-content:start -->
  <main class="max-w-6xl mx-auto">

    <!-- ===== Hero 区域 ===== -->
    <section class="relative overflow-hidden px-6 pt-20 pb-16">
      <!-- 装饰性传统纹样：祥云 -->
      <div class="absolute top-8 right-10 w-40 h-40 opacity-[0.06] pointer-events-none" aria-hidden="true">
        <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="2" class="w-full h-full text-primary">
          <path d="M60 100 Q60 75 85 75 Q95 60 115 65 Q135 55 140 80 Q155 85 150 105 Q145 120 125 115 L80 115 Q60 115 60 100 Z"/>
          <path d="M75 95 Q75 85 88 85 Q95 78 105 82 Q118 78 120 90 Q128 93 125 102 Q122 110 110 108 L85 108 Q75 108 75 95 Z"/>
        </svg>
      </div>
      <!-- 装饰性传统纹样：八卦 -->
      <div class="absolute bottom-4 left-8 w-28 h-28 opacity-[0.05] pointer-events-none" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1.5" class="w-full h-full text-on-surface">
          <circle cx="50" cy="50" r="45"/>
          <path d="M50 5 A45 45 0 0 1 50 95 A22.5 22.5 0 0 1 50 50 A22.5 22.5 0 0 0 50 5 Z" fill="currentColor"/>
          <circle cx="50" cy="27.5" r="5" fill="var(--color-background)"/>
          <circle cx="50" cy="72.5" r="5" fill="currentColor"/>
        </svg>
      </div>
      <!-- 装饰：小祥云 -->
      <div class="absolute top-24 left-12 w-24 h-24 opacity-[0.04] pointer-events-none" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2" class="w-full h-full text-on-surface">
          <path d="M30 50 Q30 38 42 38 Q48 30 58 33 Q70 28 72 40 Q80 42 77 52 Q74 60 64 58 L37 58 Q30 58 30 50 Z"/>
        </svg>
      </div>

      <div class="relative text-center max-w-3xl mx-auto">
        <!-- 品牌图标 -->
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/10 mb-6">
          <i data-lucide="sparkles" class="w-7 h-7 text-primary"></i>
        </div>
        <!-- 品牌标语 -->
        <h1 class="text-4xl font-bold text-on-surface tracking-wide">
          天机阁 <span class="text-primary">·</span> 知命不惧
        </h1>
        <!-- 副标题 -->
        <p class="mt-4 text-base text-on-surface-variant leading-relaxed">
          AI 古法命理，多流派聚合解读
        </p>
        <!-- 主 CTA 按钮 -->
        <button id="btn-start" class="mt-8 bg-primary text-on-primary px-7 py-3 rounded-full text-sm font-medium hover:opacity-90 active:scale-[0.98] transition-all inline-flex items-center gap-2 shadow-card">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
          开始测算
        </button>
      </div>
    </section>

    <!-- ===== 五大功能入口卡片 ===== -->
    <section class="px-6 pb-20">
      <!-- 第一行：3 个卡片 -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-5">

        <!-- 功能卡片-八字命盘 -->
        <a href="bazi.html" id="card-bazi" class="bg-surface shadow-card rounded-xl p-6 hover:-translate-y-1 hover:shadow-float transition-all duration-300 cursor-pointer group block">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary/10 mb-4 group-hover:bg-primary/15 transition-colors">
            <i data-lucide="sparkles" class="w-6 h-6 text-primary"></i>
          </div>
          <h3 class="text-lg font-semibold text-on-surface">八字命盘</h3>
          <p class="mt-2 text-sm text-on-surface-variant leading-relaxed">四柱八字，五行十神，中式命理精髓</p>
          <div class="mt-4 inline-flex items-center gap-1 text-xs font-medium text-primary">
            <span>开始排盘</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>

        <!-- 功能卡片-星座星盘 -->
        <a href="astrology.html" id="card-astrology" class="bg-surface shadow-card rounded-xl p-6 hover:-translate-y-1 hover:shadow-float transition-all duration-300 cursor-pointer group block">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary/10 mb-4 group-hover:bg-primary/15 transition-colors">
            <i data-lucide="sun" class="w-6 h-6 text-primary"></i>
          </div>
          <h3 class="text-lg font-semibold text-on-surface">星座星盘</h3>
          <p class="mt-2 text-sm text-on-surface-variant leading-relaxed">太阳月亮上升，西方占星全解析</p>
          <div class="mt-4 inline-flex items-center gap-1 text-xs font-medium text-primary">
            <span>开始排盘</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>

        <!-- 功能卡片-塔罗占卜 -->
        <a href="tarot.html" id="card-tarot" class="bg-surface shadow-card rounded-xl p-6 hover:-translate-y-1 hover:shadow-float transition-all duration-300 cursor-pointer group block">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary/10 mb-4 group-hover:bg-primary/15 transition-colors">
            <i data-lucide="layers" class="w-6 h-6 text-primary"></i>
          </div>
          <h3 class="text-lg font-semibold text-on-surface">塔罗占卜</h3>
          <p class="mt-2 text-sm text-on-surface-variant leading-relaxed">78 张塔罗，正逆位深度解读</p>
          <div class="mt-4 inline-flex items-center gap-1 text-xs font-medium text-primary">
            <span>开始占卜</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>

      </div>

      <!-- 第二行：2 个卡片居中 -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-5 max-w-4xl mx-auto">

        <!-- 功能卡片-周公解梦 -->
        <a href="dream.html" id="card-dream" class="bg-surface shadow-card rounded-xl p-6 hover:-translate-y-1 hover:shadow-float transition-all duration-300 cursor-pointer group block">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary/10 mb-4 group-hover:bg-primary/15 transition-colors">
            <i data-lucide="moon" class="w-6 h-6 text-primary"></i>
          </div>
          <h3 class="text-lg font-semibold text-on-surface">周公解梦</h3>
          <p class="mt-2 text-sm text-on-surface-variant leading-relaxed">千年解梦典籍，AI 智慧解析</p>
          <div class="mt-4 inline-flex items-center gap-1 text-xs font-medium text-primary">
            <span>开始解梦</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>

        <!-- 功能卡片-每日运势 -->
        <a href="horoscope.html" id="card-horoscope" class="bg-surface shadow-card rounded-xl p-6 hover:-translate-y-1 hover:shadow-float transition-all duration-300 cursor-pointer group block">
          <div class="inline-flex items-center justify-center w-12 h-12 rounded-lg bg-primary/10 mb-4 group-hover:bg-primary/15 transition-colors">
            <i data-lucide="star" class="w-6 h-6 text-primary"></i>
          </div>
          <h3 class="text-lg font-semibold text-on-surface">每日运势</h3>
          <p class="mt-2 text-sm text-on-surface-variant leading-relaxed">十二星座，今日本周本月运势</p>
          <div class="mt-4 inline-flex items-center gap-1 text-xs font-medium text-primary">
            <span>查看运势</span>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          </div>
        </a>

      </div>
    </section>

    <!-- ===== 底部声明 ===== -->
    <footer class="px-6 pb-12">
      <p class="text-center text-xs text-on-surface-variant/70">
        仅供娱乐参考，不构成任何决策建议
      </p>
    </footer>

  </main>
  <!-- @main-content:end -->

  <script>
    $(function () {
      // 主 CTA 按钮 — 点击后滚动到功能卡片区域，引导用户选择测算类型
      $('#btn-start').on('click', function () {
        $('html, body').animate({ scrollTop: $('#card-bazi').offset().top - 80 }, 600);
      });
    });
  </script>

  <script>lucide.createIcons();</script>
</body>

</html>
