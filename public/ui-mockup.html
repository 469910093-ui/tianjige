<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>今天吃什么 · 天机食鉴</title>
  <link href="https://fonts.googleapis.cn/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1A1A1A;
      --color-secondary: #7A7368;
      --color-tertiary: #B8945A;
      --color-neutral: #F7F4EE;
      --color-surface: #FBF8F2;
      --color-border: #E8E2D4;
      --color-on-primary: #F7F4EE;
      --color-on-tertiary: #1A1A1A;
      --font-serif: 'DM Serif Display', 'Noto Serif SC', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
      --spacing-md: 16px;
      --spacing-lg: 24px;
      --spacing-xl: 32px;
      --spacing-2xl: 48px;
      --spacing-3xl: 72px;
      --radius-sm: 4px;
      --radius-md: 8px;
      --radius-pill: 9999px;
      --shadow-card-hover: 0 2px 8px rgba(26, 26, 26, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-neutral);
      color: var(--color-primary);
      min-height: 100vh;
      line-height: 1.6;
      font-weight: 400;
    }
    .shell { max-width: 640px; margin: 0 auto; min-height: 100vh; position: relative; }
    .label-caps {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav {
      position: sticky; top: 0; z-index: 20;
      height: 64px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px;
      background: rgba(247, 244, 238, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid transparent;
      transition: border-color .2s;
    }
    .nav.scrolled { border-bottom-color: var(--color-border); }
    .brand {
      display: flex; align-items: center; gap: 12px;
      font-family: var(--font-serif); font-weight: 400;
      letter-spacing: -0.01em; font-size: 1.125rem;
      color: var(--color-primary);
    }
    .brand-mark {
      width: 28px; height: 28px; color: var(--color-tertiary);
      display: grid; place-items: center;
    }
    .brand-mark svg { width: 22px; height: 22px; }
    .nav-cta {
      min-height: 40px; padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--color-primary); color: var(--color-on-primary);
      border: 0; font: inherit; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
    }
    .nav-cta:hover { background: #000; }
    .hero {
      padding: 48px 24px 40px;
      position: relative;
      text-align: center;
    }
    .hero-wheel {
      width: 160px; height: 160px; margin: 0 auto 28px;
      color: var(--color-tertiary);
      animation: wheel-breathe 8s ease-in-out infinite;
    }
    @keyframes wheel-breathe {
      0%, 100% { transform: rotate(0deg); opacity: .85; }
      50% { transform: rotate(6deg); opacity: 1; }
    }
    .hero .eyebrow {
      color: var(--color-tertiary);
      margin-bottom: 16px;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .hero h1 {
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 10vw, 3.5rem);
      font-weight: 400; line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--color-primary);
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 1.0625rem; color: var(--color-secondary);
      max-width: 28em; margin: 0 auto 28px; line-height: 1.6;
    }
    .social-strip {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
      margin-bottom: 28px;
    }
    .badge-meta {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--color-tertiary);
      padding: 4px 0;
    }
    .badge-tag {
      font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.12em;
      text-transform: uppercase;
      background: var(--color-tertiary); color: var(--color-on-tertiary);
      border-radius: var(--radius-pill); padding: 4px 12px;
    }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn-primary {
      min-height: 52px; padding: 16px 32px; border: 0; border-radius: var(--radius-sm);
      background: var(--color-primary); color: var(--color-on-primary);
      font: inherit; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { background: #000; }
    .btn-secondary {
      min-height: 52px; padding: 16px 32px;
      border: 1px solid var(--color-primary); border-radius: var(--radius-sm);
      background: transparent; color: var(--color-primary);
      font: inherit; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    }
    .btn-secondary:hover { background: var(--color-primary); color: var(--color-on-primary); }
    .btn-ghost {
      min-height: 44px; padding: 8px 0; border: 0; background: transparent;
      color: var(--color-primary); font: inherit; font-size: 1rem; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; text-decoration: underline;
      text-underline-offset: 4px;
    }
    .btn-ghost:hover { color: var(--color-tertiary); }
    .divider {
      height: 1px; background: var(--color-border);
      margin: 0 24px;
    }
    .section { padding: var(--spacing-3xl) 24px var(--spacing-2xl); }
    .section.tight { padding-top: var(--spacing-2xl); }
    .section-head { margin-bottom: var(--spacing-xl); }
    .section-head .eyebrow { color: var(--color-tertiary); margin-bottom: 8px; }
    .section-head h2 {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 2rem; line-height: 1.2; letter-spacing: -0.015em;
      color: var(--color-primary);
    }
    .card {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      padding: 32px 24px;
      margin-bottom: 16px;
      border: 1px solid transparent;
      transition: box-shadow .2s;
    }
    .card:hover { box-shadow: var(--shadow-card-hover); }
    .card-title {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 8px;
    }
    .card-title .glyph {
      width: 36px; height: 36px; color: var(--color-tertiary);
      display: grid; place-items: center;
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    }
    .card-title .glyph svg { width: 18px; height: 18px; }
    .card h2, .card-title h2 {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 1.75rem; letter-spacing: -0.01em;
      color: var(--color-primary); line-height: 1.2;
    }
    .sub { color: var(--color-secondary); font-size: 0.875rem; margin-bottom: 20px; line-height: 1.5; }
    label {
      display: block; font-size: 0.75rem; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--color-secondary); margin: 16px 0 8px;
    }
    .row { display: flex; gap: 12px; }
    select, input[type=date], input[type=text] {
      width: 100%; min-height: 48px; border-radius: var(--radius-sm);
      border: 1px solid var(--color-border); background: var(--color-surface);
      color: var(--color-primary); padding: 12px 16px; font: inherit; font-size: 1rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--color-tertiary); }
    select option { background: var(--color-surface); }
    .seg { display: flex; gap: 8px; }
    .seg button {
      flex: 1; min-height: 44px; border-radius: var(--radius-sm);
      border: 1px solid var(--color-border); background: var(--color-surface);
      color: var(--color-secondary); font: inherit; font-size: 0.9375rem; cursor: pointer;
    }
    .seg button.on {
      border-color: var(--color-primary); color: var(--color-primary);
      background: var(--color-neutral); font-weight: 500;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chips button {
      min-height: 32px; padding: 0 12px; border-radius: var(--radius-pill);
      border: 1px solid var(--color-border); background: transparent;
      color: var(--color-secondary); font: inherit; font-size: 0.75rem; cursor: pointer;
    }
    .chips button.on {
      background: var(--color-tertiary); border-color: var(--color-tertiary);
      color: var(--color-on-tertiary); font-weight: 600;
    }
    .warn {
      background: var(--color-neutral);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 16px;
      font-size: 0.875rem; color: var(--color-secondary); line-height: 1.55;
    }
    .warn strong { color: var(--color-primary); font-weight: 600; }
    .disclaimer {
      text-align: center; color: var(--color-secondary);
      font-size: 0.75rem; letter-spacing: 0.08em;
      padding: 72px 24px 56px;
      font-family: var(--font-serif);
    }
    .hidden { display: none !important; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: var(--color-tertiary);
      border: 1px solid var(--color-border); border-radius: var(--radius-pill);
      padding: 4px 12px; letter-spacing: 0.04em;
    }
    .tabs {
      display: flex; gap: 0; margin: 24px 0 16px;
      border-bottom: 1px solid var(--color-border);
    }
    .tabs button {
      flex: 1; min-height: 44px; border: 0; background: transparent;
      color: var(--color-secondary); font: inherit; font-size: 0.8125rem;
      font-weight: 500; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      letter-spacing: 0.04em;
    }
    .tabs button.on {
      color: var(--color-primary);
      border-bottom-color: var(--color-tertiary);
    }
    .scores {
      background: var(--color-neutral);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px;
    }
    .score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .score-row:last-child { margin-bottom: 0; }
    .score-row span.l { width: 36px; font-size: 0.75rem; color: var(--color-secondary); }
    .score-row span.n { width: 28px; text-align: right; font-size: 0.75rem; color: var(--color-primary); font-weight: 600; }
    .bar {
      flex: 1; height: 4px; border-radius: var(--radius-pill);
      background: var(--color-border); overflow: hidden;
    }
    .bar i {
      display: block; height: 100%; border-radius: var(--radius-pill);
      background: var(--color-tertiary);
    }
    .block { margin-bottom: 14px; }
    .block h4 {
      font-size: 0.75rem; font-weight: 600; color: var(--color-tertiary);
      margin-bottom: 6px; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .block p { font-size: 0.9375rem; line-height: 1.6; color: var(--color-primary); }
    .advice {
      margin-top: 8px; padding: 14px 16px; border-radius: var(--radius-md);
      background: var(--color-neutral);
      border: 1px solid var(--color-border);
      color: var(--color-primary); font-size: 0.875rem;
    }
    .food-summary {
      margin: 16px 0 0;
      padding: 16px; border-radius: var(--radius-md);
      background: var(--color-neutral);
      border: 1px solid var(--color-border);
    }
    .food-summary .label {
      font-size: 0.75rem; font-weight: 600; color: var(--color-tertiary);
      letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .food-summary .label svg { width: 14px; height: 14px; }
    .food-summary p {
      font-size: 1rem; line-height: 1.55; font-family: var(--font-serif);
      color: var(--color-primary);
    }
    .basis { margin-top: 16px; font-size: 0.8125rem; color: var(--color-secondary); line-height: 1.5; }
    .m-card, .g-card, .guest-row, .party-person {
      border: 1px solid var(--color-border); border-radius: var(--radius-md);
      padding: 16px; margin-bottom: 10px;
      background: var(--color-neutral);
    }
    .m-card .name, .g-card .name, .party-person .nm {
      font-weight: 500; color: var(--color-primary); font-size: 0.9375rem;
      display: flex; align-items: center; gap: 8px;
    }
    .tag-v {
      font-size: 0.625rem; padding: 2px 8px; border-radius: var(--radius-pill);
      background: var(--color-tertiary); color: var(--color-on-tertiary);
      letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600;
    }
    .m-card .meta, .g-card .meta, .party-person .meta { font-size: 0.8125rem; color: var(--color-secondary); margin-top: 4px; }
    .m-card .bl, .g-card .rule, .party-person .food { font-size: 0.875rem; color: var(--color-primary); margin-top: 8px; line-height: 1.5; }
    .g-card .host { font-size: 0.8125rem; color: var(--color-tertiary); margin-top: 6px; }
    .guest-row .row-title {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.75rem; color: var(--color-secondary); margin-bottom: 8px;
      font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    }
    .guest-row input, .guest-row select { min-height: 40px; margin-bottom: 8px; font-size: 0.9375rem; }
    .social-band {
      margin: 0 24px 32px;
      padding: 28px 24px;
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      text-align: center;
    }
    .social-band h3 {
      font-family: var(--font-serif); font-weight: 400;
      font-size: 1.5rem; margin: 12px 0 8px;
    }
    .social-band p { color: var(--color-secondary); font-size: 0.9375rem; margin-bottom: 16px; }
    .social-steps {
      display: grid; grid-template-columns: 1fr; gap: 12px; text-align: left;
      padding: 0; margin: 0;
    }
    .social-steps li {
      list-style: none; padding: 12px 14px;
      border-left: 2px solid var(--color-tertiary);
      background: var(--color-neutral);
      font-size: 0.875rem; color: var(--color-primary);
    }
    .social-steps li span {
      display: block; font-size: 0.6875rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--color-tertiary); font-weight: 600; margin-bottom: 4px;
    }
    .oracle-quote {
      margin: 8px 24px 40px;
      padding: 40px 24px;
      text-align: center;
      position: relative;
    }
    .oracle-quote::before,
    .oracle-quote::after {
      content: '';
      display: block;
      width: 48px; height: 1px;
      background: var(--color-tertiary);
      margin: 0 auto 20px;
      opacity: 0.7;
    }
    .oracle-quote::after { margin: 20px auto 0; }
    .oracle-quote blockquote {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 400;
      line-height: 1.45;
      letter-spacing: -0.01em;
      color: var(--color-primary);
      max-width: 18em;
      margin: 0 auto 12px;
    }
    .oracle-quote cite {
      font-style: normal;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-secondary);
    }
    .vibe-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 0 24px 8px;
    }
    .vibe-cell {
      padding: 20px 16px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .vibe-cell .glyph {
      width: 28px; height: 28px; margin: 0 auto 10px;
      color: var(--color-tertiary);
    }
    .vibe-cell .glyph svg { width: 28px; height: 28px; }
    .vibe-cell strong {
      display: block;
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 1.0625rem;
      margin-bottom: 6px;
      color: var(--color-primary);
    }
    .vibe-cell span {
      font-size: 0.8125rem;
      color: var(--color-secondary);
      line-height: 1.45;
    }
    .social-band .eyebrow { color: var(--color-tertiary); margin-bottom: 4px; }
    .party-hint {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
      font-size: 0.8125rem;
      color: var(--color-secondary);
      letter-spacing: 0.02em;
    }
    .party-hint em {
      font-style: normal;
      color: var(--color-tertiary);
      font-weight: 600;
      letter-spacing: 0.08em;
    }
  </style>
</head>

  <script>
    const SHENGXIAO = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];
    let reportSet = null;
    let activeTab = 'overview';

    window.addEventListener('scroll', () => {
      document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 8);
    }, { passive: true });

    function hashSeed(s) {
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      return Math.abs(h);
    }
    function clamp(n) { return Math.max(35, Math.min(95, Math.round(n))); }
    function scoreFrom(seed, base, spread) {
      spread = spread || 18;
      return clamp(base + (seed % (spread * 2 + 1)) - spread);
    }
    function shengxiaoOf(year) {
      return SHENGXIAO[(year - 4) % 12];
    }
    function toneHint() {
      return '节奏先稳住，再谈扩张。';
    }

    function foodSummaryOf(strong, weak) {
      const eatByWeak = {
        木: '青绿时蔬、菌菇、清淡酸香小菜',
        火: '苦瓜、绿叶菜、清汤慢炖',
        土: '杂粮、南瓜、温热家常菜',
        金: '白肉清汤、萝卜白菜、辛香调味适中',
        水: '温热汤羹、豆制品、略偏咸鲜',
      };
      const avoidByStrong = {
        木: '过酸刺激、生冷硬撑',
        火: '过烫油炸、重辣烧烤',
        土: '过甜油腻、冷饮冰品',
        金: '过咸熏烤、燥热辛辣堆叠',
        水: '过量冰饮、过咸腌制',
      };
      const eat = eatByWeak[weak] || '清淡温热、好消化的家常菜';
      const avoid = avoidByStrong[strong] || '过油过辣、冰凉硬撑';
      return `今天适合吃：${eat}；不适合吃：${avoid}。`;
    }

    /** 对齐 PRD §3.3 / MIGRATION §4.4：四 Tab + 五维评分 + 白话 + 金句建议 */
    function buildReport({ date, name }) {
      const [y, m, d] = date.split('-').map(Number);
      const sx = shengxiaoOf(y);
      const now = new Date();
      const today = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const thisMonth = `${now.getFullYear()}年${now.getMonth() + 1}月`;
      const thisYear = `${now.getFullYear()}年`;
      const seed = hashSeed(`${date}|${name || '我'}|午时`);
      const strong = ['木','火','土','金','水'][seed % 5];
      const weak = ['木','火','土','金','水'][(seed + 2) % 5];
      const tone = toneHint();

      function sec(s, texts, bases) {
        bases = bases || { o: 72, c: 70, l: 68, w: 66, h: 74 };
        return {
          overall: { score: scoreFrom(s, bases.o), text: texts.o },
          career: { score: scoreFrom(s >> 3, bases.c), text: texts.c },
          love: { score: scoreFrom(s >> 5, bases.l), text: texts.l },
          wealth: { score: scoreFrom(s >> 7, bases.w), text: texts.w },
          health: { score: scoreFrom(s >> 9, bases.h), text: texts.h },
          advice: texts.a,
        };
      }

      return {
        overview: sec(seed, {
          o: `${name || '主测'}属${sx}，生于${y}年${m}月${d}日（默认午时）。五行里${strong}气更足，${weak}偏弱。布局求同：做事别一个人硬刚，协作更顺。${tone}`,
          c: '事业上更适合把力气花在「选对题」而不是「证明自己」。格局不虚，但急于翻盘容易翻车。不如先把手头一件事做透，再谈扩张。',
          l: '感情里别把「对错」当唯一标准。愿意听、愿意让一步，气场反而更稳。单身不妨多出现在轻松场合，有伴则少翻旧账。',
          w: '财运宜稳不宜赌。进账靠节制和信用，不靠一次梭哈。有大额支出先晾一晚再定。',
          h: `作息比补品重要。${weak}弱时更要防透支——肩颈、肠胃、睡眠任挑一个先管住。`,
          a: '少做证明题，多做选择题。仅供娱乐，勿作人生重大决策依据。',
        }),
        daily: sec(seed + 11, {
          o: `今天是${today}。日运对命盘不硬碰，宜沟通、整理；忌硬刚、冲动消费。今天适合把一件小事办完，别开头太多头。`,
          c: '职场里沟通比硬刚管用。有分歧先对齐目标，再谈立场。',
          l: '感情上多一句体贴，少一句反驳。约会选轻松的，别上强度。',
          w: '别冲动下单。小钱可花在体验上，大钱再等等风头。',
          h: '喝水、走动、早点睡。今天别用咖啡硬顶。',
          a: '今天把「一件该做的事」做完，比空想十件强。',
        }, { o: 70, c: 68, l: 72, w: 64, h: 76 }),
        monthly: sec(seed + 29, {
          o: `${thisMonth}整体走势平稳偏上。月份对${strong}有利时，适合推进协作型项目；${weak}弱的月份，别硬扛体能与情绪。`,
          c: '本月事业看「节奏」：前半月收口旧事，后半月再开新局更稳。',
          l: '关系里多给确定性。暧昧拖太久，双方都累。',
          w: '财运宜规划不宜冒险。账单、保险、备用金先理顺。',
          h: '运动选温和的，比突然暴练更对盘。',
          a: '本月口诀：先收口，再开局。',
        }, { o: 73, c: 71, l: 69, w: 67, h: 75 }),
        yearly: sec(seed + 47, {
          o: `${thisYear}大势：适合把力气花在协作与长期关系上，别一个人硬刚全年。太岁年注意口舌与行程变动，备选方案比死磕更有用。`,
          c: '今年事业看「选择题」：少证明、多对齐资源。升迁与跳槽都要留缓冲。',
          l: '感情宜真诚不宜表演。重要关系值得当面说清楚。',
          w: '年运财气靠复利与信用，不靠一键子买卖。大额投资务必冷静。',
          h: '全年防透支。节假日补觉，比年底一次性崩盘强。',
          a: '今年少做证明题，多做选择题。娱乐参考，重大决策请另找专业意见。',
        }, { o: 74, c: 72, l: 70, w: 68, h: 73 }),
        foodSummary: foodSummaryOf(strong, weak),
        basis: `流派依据（预览）：生肖${sx} · 五行旺${strong}/弱${weak} · 默认午时。正式环境 /unified 会并行引擎排盘。`,
      };
    }

    function renderSection(sec) {
      const rows = [
        ['总评', sec.overall.score],
        ['事业', sec.career.score],
        ['感情', sec.love.score],
        ['财运', sec.wealth.score],
        ['健康', sec.health.score],
      ].map(([l, n]) =>
        `<div class="score-row"><span class="l">${l}</span><div class="bar"><i style="width:${n}%"></i></div><span class="n">${n}</span></div>`
      ).join('');
      return `
        <div class="scores">${rows}</div>
        <div class="block"><h4>总论</h4><p>${sec.overall.text}</p></div>
        <div class="block"><h4>事业</h4><p>${sec.career.text}</p></div>
        <div class="block"><h4>感情</h4><p>${sec.love.text}</p></div>
        <div class="block"><h4>财运</h4><p>${sec.wealth.text}</p></div>
        <div class="block"><h4>健康</h4><p>${sec.health.text}</p></div>
        <div class="advice">${sec.advice}</div>`;
    }

    function showTab(key) {
      activeTab = key;
      document.querySelectorAll('#reportTabs button').forEach(b => {
        b.classList.toggle('on', b.dataset.tab === key);
      });
      if (!reportSet) return;
      document.getElementById('reportBody').innerHTML = renderSection(reportSet[key]);
      document.getElementById('reportBasis').textContent = reportSet.basis;
    }

    document.querySelectorAll('#reportTabs button').forEach(btn => {
      btn.onclick = () => showTab(btn.dataset.tab);
    });

    let companions = [
      { id: 'host', name: '我', date: '1998-07-12' },
    ];

    function renderGuestEditor() {
      const box = document.getElementById('guestList');
      box.innerHTML = companions.map((g, i) => `
        <div class="guest-row" data-id="${g.id}">
          <div class="row-title">
            <span>${i === 0 ? '主测' : '同伴 ' + i}</span>
            ${i > 0 ? `<button type="button" class="btn-ghost" style="min-height:32px;padding:0 12px;font-size:12px" data-del="${g.id}">删除</button>` : ''}
          </div>
          <label style="font-size:12px;color:var(--muted)">名字</label>
          <input type="text" data-f="name" data-id="${g.id}" value="${g.name}" placeholder="名字" />
          <label style="font-size:12px;color:var(--muted)">生日</label>
          <input type="date" data-f="date" data-id="${g.id}" value="${g.date}" />
        </div>
      `).join('');

      box.querySelectorAll('[data-del]').forEach(btn => {
        btn.onclick = () => {
          companions = companions.filter(c => c.id !== btn.getAttribute('data-del'));
          renderGuestEditor();
        };
      });
      box.querySelectorAll('[data-f]').forEach(el => {
        el.onchange = el.oninput = () => {
          const id = el.getAttribute('data-id');
          const f = el.getAttribute('data-f');
          const c = companions.find(x => x.id === id);
          if (c) c[f] = el.value;
        };
      });
    }

    function addCompanion() {
      if (companions.length >= 10) return;
      const id = 'c' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
      companions.push({
        id,
        name: '同伴' + companions.length,
        date: '1995-03-08',
      });
      renderGuestEditor();
      requestAnimationFrame(() => {
        const row = document.querySelector(`#guestList .guest-row[data-id="${id}"]`);
        if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    }
    const addGuestBtn = document.getElementById('addGuestBtn');
    if (addGuestBtn) {
      addGuestBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        addCompanion();
      });
    }
    renderGuestEditor();

    function wxFromYear(year, seed) {
      const strong = ['木','火','土','金','水'][(year + seed) % 5];
      const weak = ['木','火','土','金','水'][(year + seed + 2) % 5];
      return { strong, weak, sx: SHENGXIAO[(year - 4) % 12] };
    }

    function synthPartyPeople(people) {
      const weakScore = {金:0,木:0,水:0,火:0,土:0};
      const strongScore = {金:0,木:0,水:0,火:0,土:0};
      people.forEach(p => { weakScore[p.weak]++; strongScore[p.strong]++; });
      const topWeak = Object.entries(weakScore).sort((a,b)=>b[1]-a[1])[0][0];
      const topStrong = Object.entries(strongScore).sort((a,b)=>b[1]-a[1])[0][0];
      const eatMap = {木:'青绿时蔬、菌菇',火:'苦瓜、清汤绿叶',土:'杂粮、南瓜家常',金:'白肉清汤、萝卜白菜',水:'温热汤羹、豆制品'};
      const avoidMap = {木:'过酸生冷',火:'过烫油炸重辣',土:'过甜油腻冷饮',金:'过咸熏烤燥热',水:'过量冰饮腌制'};
      const names = people.map(p=>p.name).join('、');
      return {
        groupFood: `今晚 ${people.length} 人（${names}）综合：适合吃「${eatMap[topWeak]}」；不太适合「${avoidMap[topStrong]}」。群体偏补${topWeak}、慎过旺${topStrong}。`,
        mbtiNote: '',
        cardsHtml: people.map(p => `
          <div class="party-person">
            <div class="nm">${p.name}</div>
            <div class="meta">属${p.sx} · ${p.strong}旺${p.weak}弱 · ${p.date}</div>
            <div class="food">${foodSummaryOf(p.strong, p.weak)}</div>
          </div>`).join(''),
      };
    }

    document.getElementById('submitBtn').onclick = () => {
      if (!companions.length) return;
      const people = companions.map((c, idx) => {
        const y = Number((c.date || '1995-01-01').split('-')[0]);
        const wx = wxFromYear(y, idx + 1);
        return {
          name: c.name || (idx === 0 ? '我' : '同伴' + idx),
          date: c.date || '1995-01-01',
          ...wx,
        };
      });
      const host = people[0];
      const synth = synthPartyPeople(people);
      partyPeople = people.length;
      document.querySelectorAll('#peopleSeg button').forEach(b => b.classList.remove('on'));
      const exact = [...document.querySelectorAll('#peopleSeg button')].find(b => Number(b.dataset.p) === Math.min(8, partyPeople <= 2 ? 2 : partyPeople <= 4 ? 4 : partyPeople <= 6 ? 6 : 8));
      if (exact) exact.classList.add('on');
      document.getElementById('profileChipText').textContent =
        `${people.length}人 · ${host.name} · ${host.date}`;
      reportSet = buildReport({ date: host.date, name: host.name });
      reportSet.foodSummary = synth.groupFood;
      document.getElementById('reportSub').textContent = '';
      document.getElementById('foodSummaryText').textContent = synth.groupFood;
      document.getElementById('foodSummary').classList.remove('hidden');
      const pc = document.getElementById('partyCards');
      pc.innerHTML = synth.cardsHtml;
      pc.classList.remove('hidden');
      showTab('overview');
      document.getElementById('resultPanel').classList.remove('hidden');
      renderMerchants();
      renderGames();
      document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth' });
    };

    document.getElementById('resetBtn').onclick = () => {
      document.getElementById('resultPanel').classList.add('hidden');
      document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth' });
    };

    /* —— 附近落座：优先百度真实店 + 美团/点评深链；失败才虚拟 —— */
    let partyPeople = 4;
    let iceScene = 'table';
    let adultOk = false;
    let gameSeed = 1;
    let merchantSort = 'rating';
    let minRating = 0;
    let spiceFilter = 'any'; // any | spicy | mild
    let liveMerchants = []; // {name,category,rating,price,min,max,addr,dist,source,uid,meituan,dianping,baidu}
    let merchantSource = 'loading'; // loading | baidu | virtual | error
    let merchantNote = '';
    let userLat = 30.27258;
    let userLng = 120.0057;
    let userCity = '杭州市';

    const VIRTUAL_POOL = [
      { name: '云海小厨·家常', category: '家常菜', rating: 4.5, price: '68', min: 2, max: 8, addr: '示例路 12 号', dist: 320, source: 'virtual' },
      { name: '半盏火锅局', category: '火锅', rating: 4.6, price: '98', min: 3, max: 12, addr: '示例街 88 号', dist: 480, source: 'virtual' },
      { name: '青灯烧烤铺', category: '烧烤', rating: 4.3, price: '75', min: 3, max: 10, addr: '示例巷 6 号', dist: 560, source: 'virtual' },
      { name: '月白咖啡馆', category: '咖啡', rating: 4.7, price: '42', min: 1, max: 4, addr: '示例广场 B1', dist: 210, source: 'virtual' },
      { name: '同袍私房菜', category: '私房菜', rating: 4.8, price: '128', min: 2, max: 6, addr: '示例里 3 弄', dist: 390, source: 'virtual' },
      { name: '聚气自助涮', category: '自助涮', rating: 4.2, price: '99', min: 2, max: 20, addr: '示例大道 168 号', dist: 720, source: 'virtual' },
      { name: '团圆大宴楼', category: '宴会', rating: 4.3, price: '120', min: 8, max: 30, addr: '示例会展馆', dist: 880, source: 'virtual' },

      { id: 'mirror-toast', name: '镜像干杯', scene: 'drink', minutes: 4, rule: '两人一组镜像手势并干杯；没同步的一侧小酌或喝茶。', host: '对着镜子干杯——手势没同步，慢的那口先喝。', minP: 4, maxP: 16, adult: true },
      { id: 'wish-round', name: '愿望轮干杯', scene: 'drink', minutes: 6, rule: '每人说一个小愿望，全桌为其干杯一次。', host: '每人一个小愿望，我们为你干杯。', minP: 3, maxP: 14, adult: true },

    function getApiBase() {
      const q = new URLSearchParams(location.search).get('api');
      if (q) {
        try { localStorage.setItem('NEARBY_API_BASE', q.replace(/\/$/, '')); } catch (_) {}
        return q.replace(/\/$/, '');
      }
      try {
        const saved = (localStorage.getItem('NEARBY_API_BASE') || '').trim().replace(/\/$/, '');
        if (saved) return saved;
      } catch (_) {}
      // 纯静态预览（如 python http.server :8765）没有 /api → 默认打本机 Next
      const port = location.port;
      const host = location.hostname;
      if ((host === '127.0.0.1' || host === 'localhost') && port && port !== '5000') {
        return 'http://127.0.0.1:5000';
      }
      // 同源 Next（localhost:5000 / 隧道域名）用相对路径
      return '';
    }

    function meituanUrl(name, city) {
      const q = (name || '').replace(/[（(].*?[）)]/g, '').trim() || name;
      const c = (city || '').replace(/市$/, '');
      return `https://m.meituan.com/s/?q=${encodeURIComponent(c ? c + ' ' + q : q)}`;
    }
    function dianpingUrl(name) {
      const q = (name || '').replace(/[（(].*?[）)]/g, '').trim() || name;
      return `https://m.dianping.com/shoplist/0/r/0/c/0/s/s_-1?keyword=${encodeURIComponent(q)}`;
    }

    async function fetchNearbyApi(lat, lng, people) {
      const base = getApiBase();
      const qs = new URLSearchParams({
        lat: String(lat),
        lng: String(lng),
        radius: '3000',
        people: String(people),
      });
      const url = `${base}/api/nearby?${qs}`;
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) throw new Error('接口 HTTP ' + res.status);
      const json = await res.json();
      if (!json.ok || !json.merchants?.length) throw new Error(json.error || json.note || '无结果');
      if (json.virtual || json.provider === 'virtual') {
        const err = new Error(json.note || '服务端仍返回虚拟店（请检查 BAIDU_MAP_AUTH_TOKEN）');
        err.code = 'API_VIRTUAL';
        err.merchants = json.merchants;
        throw err;
      }
      if (json.city) userCity = json.city;
      return json.merchants.map(m => ({
        name: m.name,
        category: m.category,
        rating: m.rating,
        price: m.price || '',
        min: m.minPeople || 1,
        max: m.maxPeople || 30,
        addr: m.address || '',
        dist: m.distanceM || 0,
        source: 'baidu',
        uid: m.uid || '',
        hours: m.shopHours || '',
        image: m.image || '',
        meituan: (m.actions || []).find(a => a.platform === 'meituan')?.url || meituanUrl(m.name, json.city),
        dianping: (m.actions || []).find(a => a.platform === 'dianping')?.url || dianpingUrl(m.name),
        baidu: m.detailUrl || '',
      }));
    }

    function guessSpice(name, category) {
      const text = (name || '') + ' ' + (category || '');
      if (/辣|麻辣|香辣|酸辣|泡椒|椒麻|剁椒|水煮|干锅|冒菜|串串|火锅|重庆|成都|川菜|湘菜|贵州|云南|小龙虾|烧烤|烤肉|烤鱼|钵钵鸡|鸭血粉丝|毛血旺/.test(text)) return 'spicy';
      if (/粤|潮汕|本帮|杭帮|淮扬|苏帮|日料|寿司|刺身|清淡|白切|清蒸|广东|港式|意面|西餐|咖啡|甜品|面包|沙拉|粥|面馆|饺子|馄饨|私房菜/.test(text)) return 'mild';
      return 'unknown';
    }

    function recommendScore(m, maxDist) {
      const ratingPart = Math.min(Math.max((m.rating ?? 3.6) / 5, 0), 1);
      const distPart = 1 - Math.min(Math.max(m.dist, 0) / Math.max(maxDist, 1), 1);
      return ratingPart * 0.6 + distPart * 0.4;
    }

    function renderMerchants() {
      const box = document.getElementById('merchantList');
      const statusEl = document.getElementById('mapConfigStatus');
      const base = getApiBase();
      if (statusEl) {
        statusEl.textContent =
          merchantSource === 'baidu' ? '· 已加载百度真实餐厅'
          : merchantSource === 'loading' ? '· 正在经服务端检索…'
          : base ? `· API：${base}`
          : '· 使用当前站点 /api/nearby';
      }
      if (merchantSource === 'loading') {
        box.innerHTML = '<div class="warn">正在经服务端调用百度地图检索真实餐厅…</div>';
        return;
      }

      let list = (liveMerchants.length ? liveMerchants : VIRTUAL_POOL)
        .filter(p => (p.dist || 0) <= 3000)
        .filter(p => partyPeople >= (p.min || 1) && partyPeople <= (p.max || 30));
      if (minRating > 0) {
        list = list.filter(p => p.rating != null && Number(p.rating) >= minRating);
      } else {
        // 评分榜：无评分的排后面/默认不进完整排名
        list = list.filter(p => p.rating != null);
      }
      if (spiceFilter === 'spicy') {
        list = list.filter(p => guessSpice(p.name, p.category) === 'spicy');
      } else if (spiceFilter === 'mild') {
        list = list.filter(p => guessSpice(p.name, p.category) !== 'spicy');
      }
      if (!list.length && !liveMerchants.length) {
        list = [...VIRTUAL_POOL].filter(p => p.rating != null && (minRating <= 0 || p.rating >= minRating));
        if (spiceFilter === 'spicy') list = list.filter(p => guessSpice(p.name, p.category) === 'spicy');
        else if (spiceFilter === 'mild') list = list.filter(p => guessSpice(p.name, p.category) !== 'spicy');
      }
      const maxDist = 3000;
      list = [...list].sort((a, b) => {
        if (merchantSort === 'rating') {
          if ((b.rating ?? -1) !== (a.rating ?? -1)) return (b.rating ?? -1) - (a.rating ?? -1);
          return a.dist - b.dist;
        }
        if (merchantSort === 'distance') {
          if (a.dist !== b.dist) return a.dist - b.dist;
          return (b.rating ?? 0) - (a.rating ?? 0);
        }
        const sa = recommendScore(a, maxDist);
        const sb = recommendScore(b, maxDist);
        if (sb !== sa) return sb - sa;
        return a.dist - b.dist;
      });
      const use = list.slice(0, 12);
      const isVirt = merchantSource !== 'baidu';
      const ratingHint = minRating > 0
        ? `评分 ≥${minRating.toFixed(1)} · 共 ${list.length} 家`
        : `3公里内有评分 · 共 ${list.length} 家 · 评分降序`;
      const head = !list.length
        ? `<div class="warn" style="margin-bottom:12px"><strong>无匹配</strong>：当前 ${ratingHint}。请改口味或下调最低评分。</div>`
        : isVirt
        ? `<div class="warn" style="margin-bottom:12px"><strong>虚拟推荐</strong>：${merchantNote || '请用本机 http://127.0.0.1:5000/ui-mockup.html'} · ${ratingHint}</div>`
        : `<div class="warn" style="margin-bottom:12px"><strong>仓南广场 · 3公里美食评分榜</strong>：${merchantNote || userCity} · ${ratingHint}</div>`;

      const ratingLabel = document.getElementById('minRatingLabel');
      if (ratingLabel) ratingLabel.textContent = minRating <= 0 ? '不限（完整排名）' : `≥ ${minRating.toFixed(1)}`;
      const hintEl = document.getElementById('ratingFilterHint');
      if (hintEl) hintEl.textContent = `仓南广场 3 公里 · 评分降序 · 展示 ${use.length}/${list.length} 家`;

      if (!list.length) {
        box.innerHTML = head;
        return;
      }

      box.innerHTML = head + use.map((m, idx) => `
        <div class="m-card">
          <div class="name"><span class="tag-v" style="${idx < 3 ? 'background:var(--color-tertiary);color:var(--color-on-tertiary)' : ''}">#${idx + 1}</span> ${m.name}${merchantSort === 'rating' && idx === 0 ? '<span class="tag-v" style="background:var(--color-tertiary);color:var(--color-on-tertiary)">评分第1</span>' : ''}<span class="tag-v">${isVirt ? '虚拟' : '百度'}</span></div>
          <div class="meta">${m.category || '美食'}${m.rating != null ? ' · 评分 ' + m.rating : ' · 暂无评分'}${m.price ? ' · 人均¥' + m.price : ''} · ${m.dist}m</div>
          <div class="meta">${isVirt ? '（虚拟）' : ''}${m.addr || ''}${m.hours ? ' · 营业 ' + m.hours : ''}</div>
          <div class="bl">仓南广场 3 公里内 · 按评分排名</div>
          ${!isVirt ? `<div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap">
            <a class="btn-secondary" style="min-height:36px;padding:6px 12px;font-size:11px;text-decoration:none" href="${m.meituan}" target="_blank" rel="noreferrer">美团搜店</a>
            <a class="btn-secondary" style="min-height:36px;padding:6px 12px;font-size:11px;text-decoration:none" href="${m.dianping}" target="_blank" rel="noreferrer">点评搜店</a>
            ${m.baidu ? `<a class="btn-secondary" style="min-height:36px;padding:6px 12px;font-size:11px;text-decoration:none" href="${m.baidu}" target="_blank" rel="noreferrer">百度详情</a>` : ''}
          </div>` : ''}
        </div>`).join('');
    }

    async function loadLiveMerchants() {
      merchantSource = 'loading';
      renderMerchants();
      const locate = () => new Promise((resolve) => {
        // 默认直接用仓南广场，不抢定位授权
        resolve({ lat: userLat, lng: userLng, note: '仓南广场 3 公里美食评分榜' });
      });
      const loc = await locate();
      userLat = loc.lat; userLng = loc.lng;
      try {
        const list = await fetchNearbyApi(userLat, userLng, partyPeople);
        liveMerchants = list;
        merchantSource = 'baidu';
        const base = getApiBase() || location.origin;
        merchantNote = (loc.note ? loc.note + ' · ' : '') + `经 ${base}/api/nearby · ${userCity || ''}`;
      } catch (e) {
        if (e && e.code === 'API_VIRTUAL' && e.merchants) {
          liveMerchants = e.merchants.map(m => ({
            name: m.name, category: m.category, rating: m.rating, price: m.price || '',
            min: m.minPeople || 1, max: m.maxPeople || 30, addr: m.address || '', dist: m.distanceM || 0,
            source: 'virtual', hours: '', image: '', meituan: '', dianping: '', baidu: '',
          }));
        } else {
          liveMerchants = [];
        }
        merchantSource = 'virtual';
        const msg = e && e.message ? e.message : String(e);
        merchantNote = msg.includes('Failed to fetch')
          ? '无法访问 /api/nearby。请先 pnpm next dev --port 5000，再打开 http://127.0.0.1:5000/ui-mockup.html（纯静态页无法直连百度）。'
          : msg;
      }
      renderMerchants();
    }

    function renderGames() {
      const adultLabel = document.getElementById('adultLabel');
      if (iceScene === 'drink') {
        adultLabel.classList.remove('hidden');
        adultLabel.style.display = 'flex';
      } else {
        adultLabel.classList.add('hidden');
        adultLabel.style.display = 'none';
      }
      const scene = iceScene === 'drink' && !adultOk ? 'table' : iceScene;
      let pool = GAMES.filter(g => g.scene === scene && partyPeople >= g.minP && partyPeople <= g.maxP && (!g.adult || adultOk));
      if (!pool.length) pool = GAMES.filter(g => g.scene === 'table');
      const sorted = [...pool].sort((a, b) => ((a.id.charCodeAt(0) * 31 + gameSeed) % 97) - ((b.id.charCodeAt(0) * 31 + gameSeed) % 97));
      const pick = sorted.slice(0, 3);
      document.getElementById('gameList').innerHTML = pick.map((g, i) => `
        <div class="g-card">
          <div class="name">${i + 1}. ${g.name}</div>
          <div class="meta">适合 ${g.minP}-${g.maxP} 人 · 约 ${g.minutes} 分钟</div>
          <div class="rule">${g.rule}</div>
          <div class="host">主持：${g.host}</div>
        </div>`).join('') +
        (iceScene === 'drink' && !adultOk ? '<p class="sub">未确认成年，暂显示饭桌游戏。</p>' : '');
    }

    document.querySelectorAll('#peopleSeg button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#peopleSeg button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        partyPeople = Number(btn.dataset.p);
        void loadLiveMerchants();
        renderGames();
      };
    });
    document.querySelectorAll('#merchantSortSeg button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#merchantSortSeg button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        merchantSort = btn.dataset.sort;
        renderMerchants();
      };
    });
    document.querySelectorAll('#spiceSeg button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#spiceSeg button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        spiceFilter = btn.dataset.spice || 'any';
        renderMerchants();
      };
    });
    const ratingRange = document.getElementById('minRatingRange');
    if (ratingRange) {
      ratingRange.value = String(minRating);
      ratingRange.oninput = () => {
        minRating = Number(ratingRange.value);
        renderMerchants();
      };
    }
    document.querySelectorAll('#sceneSeg button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#sceneSeg button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        iceScene = btn.dataset.s;
        renderGames();
      };
    });
    document.getElementById('adultOk').onchange = (e) => {
      adultOk = e.target.checked;
      renderGames();
    };
    document.getElementById('reshuffleGames').onclick = () => {
      gameSeed += 1;
      renderGames();
    };
    document.getElementById('saveApiBtn').onclick = () => {
      const v = (document.getElementById('apiBaseInput').value || '').trim().replace(/\/$/, '');
      try {
        if (v) localStorage.setItem('NEARBY_API_BASE', v);
        else localStorage.removeItem('NEARBY_API_BASE');
      } catch (_) {}
      void loadLiveMerchants();
    };
    try {
      const b = getApiBase();
      if (b) document.getElementById('apiBaseInput').value = b;
    } catch (_) {}
    void loadLiveMerchants();
    renderGames();
